services:
  recipe-register:
    build: .
    image: recipe-register:latest
    container_name: recipe-register
    restart: unless-stopped
    # The container runs as root. Setting `user` to the uid and gid that the
    # storage mount forces fails at start with "setgroups: invalid argument",
    # because the image holds no such user. Root gains nothing on that mount
    # either: the file server checks the share credential, and the mount forces
    # its own uid and gid on every file whatever wrote it.
    ports:
      - "${RECIPE_PORT:-8090}:3000"
    environment:
      RECIPES_DIR: /data
    volumes:
      - "${RECIPE_DATA:?set RECIPE_DATA}:/data"
